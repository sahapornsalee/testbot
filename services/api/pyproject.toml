[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-downloader-api"
version = "0.1.0"
description = "Universal Downloader API: secure URL inspection, direct downloads and media downloads"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.28,<0.29",
  "httpcore>=1.0.7,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "yt-dlp>=2025.1.1",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "external: tests that reach real third-party websites (opt-in with RUN_EXTERNAL_TESTS=1)",
  "media: tests that need yt-dlp and ffmpeg binaries",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
# ASYNC109: httpcore's backend API requires a timeout parameter.
# ASYNC240: small local filesystem calls are acceptable in the MVP.
ignore = ["S101", "B008", "ASYNC109", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]
