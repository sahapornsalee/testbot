name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Integration tests
        run: pytest tests/integration -q
      - name: Security tests
        run: pytest tests/security -q
      - name: Dependency audit
        run: pip-audit --skip-editable

  web:
    name: Web (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end smoke tests
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install API
        working-directory: services/api
        run: pip install -e ".[dev]"
      - name: Install and build web
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: apps/web
        env:
          PYTHON: python
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build images (not pushed)
        run: docker compose build

  codespaces:
    name: Codespaces scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate devcontainer.json
        run: node -e "const s=require('fs').readFileSync('.devcontainer/devcontainer.json','utf8'); JSON.parse(s.replace(/^\s*\/\/.*$/gm,''))"
      - name: Run setup and start like a codespace would
        env:
          CODESPACE_NAME: ci-check
          GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: app.github.dev
        run: |
          bash scripts/codespaces/setup.sh
          bash scripts/codespaces/start.sh
      - name: Check the forwarded origin is accepted and foreign origins are not
        run: |
          ok=$(curl -s -H 'X-UD-Client: web' -H 'Origin: https://ci-check-3000.app.github.dev' \
            -H 'Content-Type: application/json' -d '{"url":"http://169.254.169.254/"}' \
            http://127.0.0.1:3000/api/v1/inspect)
          bad=$(curl -s -H 'X-UD-Client: web' -H 'Origin: https://evil.example' \
            -H 'Content-Type: application/json' -d '{"url":"http://169.254.169.254/"}' \
            http://127.0.0.1:3000/api/v1/inspect)
          echo "$ok"; echo "$bad"
          echo "$ok" | grep -q BLOCKED_DESTINATION
          echo "$bad" | grep -q FORBIDDEN_ORIGIN
          curl -sf http://127.0.0.1:3000/api/v1/health | grep -q '"ffmpeg":"'
      - name: Stop services
        if: always()
        run: bash scripts/codespaces/stop.sh
